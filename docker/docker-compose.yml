# ============================================================
# docker-compose.yml - Clínica Digital
#
# Aplicación monolítica: el servicio "app" contiene el
# sistema completo (autenticación, citas, expediente clínico,
# notificaciones y pagos como módulos internos). Base de
# datos: MySQL, acorde al modelo relacional del proyecto.
# ============================================================

services:

  # Servicio de aplicación: PHP-FPM + Laravel (monolito)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: clinica_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - clinica_net

  # Servidor web: Nginx sirviendo la aplicación y delegando PHP a "app"
  webserver:
    image: nginx:stable-alpine
    container_name: clinica_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - clinica_net

  # Base de datos: MySQL 8 (coherente con el modelo relacional ya entregado)
  db:
    image: mysql:8.0
    container_name: clinica_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-clinica_digital}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_USER: ${DB_USERNAME:-clinica_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docs/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - clinica_net

  # Administrador visual de la base de datos
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinica_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - clinica_net

  # Redis: caché de consultas, sesiones y cola para notificaciones
  # (envío asíncrono de correos/WhatsApp de recordatorio de citas)
  redis:
    image: redis:7-alpine
    container_name: clinica_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - clinica_net

volumes:
  mysql_data:
  redis_data:

networks:
  clinica_net:
    driver: bridge
